<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AZoom Car Rental</title>

    <link rel="stylesheet" href="style.css">
    <script src="jscript.js" defer></script>
</head>



<body>

    <header>
        <a href="index.html">
            <img src="Images/azoom-logo.png" alt="AZoom Car Rental" class="logo">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="fleet.html">Our Fleet</a>
            <a href="reserve.html" class="active">Reserve</a>
            <a href="rent-return.html">Rent & Return</a>
            <a href="about.html">About Us</a>
            <a href="#" id="login-link">Login</a>
            <a href="#" id="logout-link">Logout</a>
            

        </nav>
    </header>

<main>
        <div id="login-modal">

    <div class="login-box">
        <button type="button" id="close-login">&times;</button>
        <h2>Welcome back zoomer! </h2>
        <p>Please sign in to your AZoom account.</p>

        <form id="login-form">
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>
            
        </form>
    </div>

</div>
    <section class="reserve-page">

        <h1>Reserve Your Drive</h1>
        <p>Experience luxury electric driving with AZoom.</p>

        <form id="reservation-form">

            <div class="form-group">
                <label for="vehicle">Select Vehicle</label>
                <select id="vehicle" name="vehicle" required>
                    <option value="">Choose your vehicle</option>
                    <option value="zeekr">Zeekr 001</option>
                    <option value="audi">Audi e-tron GT</option>
                    <option value="battista">Pininfarina Battista</option>
                </select>
            </div>
            <div class="vehicle-preview">
                <img id="selected-car-image" src="" alt="Selected Vehicle">
            </div>

            <div class="form-group">
                <label for="pickup-location">Pickup Location</label>
                <select id="pickup-location" name="pickup-location" required>
                    <option value="">Choose pickup location</option>
                    <option value="main">AZoom Main Branch</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pickup-date">Pickup Date</label>
                <input type="date" id="pickup-date"
                       name="pickup-date" required>
            </div>

            <div class="form-group">
                <label for="return-date">Return Date</label>
                <input type="date" id="return-date"
                       name="return-date" required>
            </div>
            <div class="rental-price">
                <h2>Estimated Rental Cost</h2>
                <p>Daily Rate: <span id="daily-rate">S$0</span></p>
                <p>Rental Duration: <span id="rental-days">0 days</span></p>
                <h3>Total: <span id="total-price">S$0</span></h3>
            </div>

            <button type="submit" class="reserve-btn">
                CONTINUE RESERVATION →
            </button>

        </form>

    </section>
</main>


    <footer>
        <p>&copy; 2026 AZoom Car Rental</p>
    </footer>

</body>
</html>
